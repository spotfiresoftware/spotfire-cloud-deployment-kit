acceptEUA: true
global:
  spotfire:
    acceptEUA: true
database:
  bootstrap:
    databaseUrl: jdbc://server/
    driverClass: org.postgresql.Driver
    password: mypassword
  create-db:
    enabled: true
    adminUsername: postgres
    adminPassword: 123456
    databaseUrl: jdbc://server/
configuration:
  encryptionPassword: 123456
  site:
    publicAddress: http://localhost/
  actionLog:
    categories: ""
    webCategories: ""
    file:
      enabled: false
    database:
      enabled: true
      create-actionlogdb:
        enabled: true
        databaseUrl: "actionlogdbAdminurl"
        adminPassword: 123456
        doNotCreateUser: false
      config-action-log-database-logger:
        databaseUrl: "actionlogdburl"
        username: "actionlogdbuser"
        password: "actionlogdbpassword"
        additionalOptions: {}
haproxy:
  enabled: false
networkPolicy:
  registration:
    additionalAllowedFrom:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: monitoring
        podSelector:
          matchLabels:
            app.kubernetes.io/name: prometheus
  logForwarder:
    additionalAllowedFrom:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: logging
        podSelector:
          matchLabels:
            app.kubernetes.io/name: external-log-sender
livenessProbe:
  enabled: false
log-forwarder:
  enabled: true
startupProbe:
  enabled: false