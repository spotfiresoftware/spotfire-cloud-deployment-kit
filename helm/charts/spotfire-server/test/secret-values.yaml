acceptEUA: true
global:
  spotfire:
    acceptEUA: true
database:
  bootstrap:
    databaseUrl: jdbc:postgresql://database/spotfire
    driverClass: org.postgresql.Driver
    passwordExistingSecret:
      name: spotfire-database-secret
      key: application-password
  create-db:
    enabled: true
    adminUsername: postgres
    databaseUrl: jdbc:postgresql://database/postgres
    adminPasswordExistingSecret:
      name: spotfire-database-secret
      key: administrator-password
configuration:
  site:
    publicAddress: http://spotfire.example
  encryptionPasswordExistingSecret:
    name: spotfire-encryption-secret
    key: password
  spotfireAdmin:
    passwordExistingSecret:
      name: spotfire-admin-secret
      key: password
  actionLog:
    database:
      enabled: true
      create-actionlogdb:
        enabled: true
        adminUsername: postgres
        databaseUrl: jdbc:postgresql://database/postgres
        adminPasswordExistingSecret:
          name: spotfire-actionlog-secret
          key: administrator-password
      config-action-log-database-logger:
        databaseUrl: jdbc:postgresql://database/spotfire_actionlog
        username: spotfire_actionlog
        passwordExistingSecret:
          name: spotfire-actionlog-secret
          key: application-password
haproxy:
  enabled: false
log-forwarder:
  enabled: false
