{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "spotfire-server.fullname" . }}-registration
  labels:
    {{- include "spotfire-server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "spotfire-server.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: service
        - port: backend
        - port: monitoring
    - ports:
        - port: 5701
        - port: 5702
        - port: 5703
        - port: 5704
        - port: info-services
      from:
        - podSelector:
            matchLabels:
              {{- include "spotfire-server.selectorLabels" . | nindent 14 }}
    - ports:
        - port: registration
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: spotfire
        {{- with .Values.networkPolicy.registration.additionalAllowedFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
{{- if and .Values.networkPolicy.enabled (index .Values "log-forwarder" "enabled") }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "spotfire-server.fullname" . }}-log-forwarder
  labels:
    {{- include "spotfire-server.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/part-of: spotfire
      app.kubernetes.io/component: logging
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: http
    - ports:
        - port: json
        - port: forward
      from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: spotfire
        {{- with .Values.networkPolicy.logForwarder.additionalAllowedFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
