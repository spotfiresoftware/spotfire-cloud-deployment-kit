database:
  bootstrap:
    databaseUrl: "jdbc:postgresql://server:5432/spotfire"
    driverClass: "org.postgresql.Driver"
    username: "postgres"
    passwordExistingSecret:
      name: "<spotfire-database-credentials>"
      key: "spotfire-database-password"
  create-db:
    adminUsername: "postgres"
    adminPasswordExistingSecret:
      name: "<spotfire-database-credentials>"
      key: "database-admin-password"
    databaseUrl: "jdbc:postgresql://server:5432/"
    doNotCreateUser: true
