# This example demonstrates using the configurationScripts and commandScripts to perform initial setup tasks.
# Before installing, create the referenced secret:
# kubectl create secret generic spotfire-example-user-credentials --from-literal=EXAMPLE_USER_PASSWORD="<YOUR-USER-PASSWORD>"

spotfire-server:
  configJob:
    extraEnvVars:
      - name: EXAMPLE_USER_PASSWORD
        valueFrom:
          secretKeyRef:
            name: spotfire-example-user-credentials
            key: EXAMPLE_USER_PASSWORD

  configuration:
    configurationScripts:
      - name: my_custom_config_script
        script: |
          echo "This is an example custom configuration tasks. "
          set-config-prop --name=lifecycle.changes-monitoring.interval-seconds --value=20 --configuration="${CONFIGURATION_FILE}" --bootstrap-config="${BOOTSTRAP_FILE}"

    commandScripts:
      - name: create_example_user_and_group
        script: |
          create-user --bootstrap-config=bootstrap.xml --tool-password="${TOOL_PASSWORD}" --username="example-user" --password="${EXAMPLE_USER_PASSWORD}" --ignore-existing=true
          create-group --bootstrap-config=bootstrap.xml --tool-password="${TOOL_PASSWORD}" --group-name="Red" --ignore-existing=true
          add-member --bootstrap-config=bootstrap.xml --tool-password="${TOOL_PASSWORD}" --member-username="example-user" --groupname="Red"
